name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies -o inai-0.1.1.vsix

      - name: Upload VSIX to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: inai-0.1.1.vsix

      - name: Publish to Open VSX
        if: ${{ env.OVSX_TOKEN != '' }}
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: npx ovsx publish inai-0.1.1.vsix -p "$OVSX_TOKEN"

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_TOKEN != '' }}
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: npx @vscode/vsce publish --packagePath inai-0.1.1.vsix -p "$VSCE_TOKEN"
